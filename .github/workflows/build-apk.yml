
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebView Android Project
        run: |
          mkdir -p app/src/main/java/com/example/phonelockapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat << 'EOF' > settings.gradle
          rootProject.name = "PhoneLockApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.example.phonelockapp'
            compileSdk 34
            defaultConfig {
              applicationId "com.example.phonelockapp"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="Phone Lock"
              android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/phonelockapp/MainActivity.java
          package com.example.phonelockapp;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("https://mithrapuramkalasamithi-sys.github.io/Phone-Lock/");
              setContentView(webView);
            }
          }
          EOF

      - name: Setup Gradle Wrapper and Build APK
        run: |
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -o gradlew
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLockApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
